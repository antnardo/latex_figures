name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The package writes files and runs external programs: Linux, macOS and Windows,
    # across the supported Pythons. No TeX here: the `latex` tests are skipped, and the
    # latex job runs them.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --group dev
      - name: Test
        run: uv run pytest -m "not latex"

  latex:
    # Renders labels with LaTeX and the default preamble, and crops with pdfcrop.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install a TeX distribution
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-science texlive-fonts-recommended texlive-extra-utils \
            cm-super dvipng ghostscript
      - run: uv sync --group dev
      - name: LaTeX tests
        run: uv run pytest -m latex -rs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --group dev
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Format
        run: uv run ruff format --check src tests examples
      - name: Types
        run: uv run mypy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
