[project]
name = "latex-figures"
dynamic = ["version"]
description = "matplotlib figures that match their LaTeX document: size in cm, fonts, preamble, decimal comma, cropping"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antonin Marchand" }]
keywords = ["matplotlib", "latex", "figures", "siunitx", "decimal comma", "pdfcrop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Matplotlib",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Typing :: Typed",
]
dependencies = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/antnardo/latex_figures"
Documentation = "https://github.com/antnardo/latex_figures/blob/main/docs/DOC.md"
Repository = "https://github.com/antnardo/latex_figures"
Issues = "https://github.com/antnardo/latex_figures/issues"
Changelog = "https://github.com/antnardo/latex_figures/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version lives in the module: one source, which publish.yml compares with the
# release tag.
[tool.hatch.version]
path = "src/latex_figures/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/latex_figures"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH", "RET"]
# RUF001-003: the prose uses typographic dashes and symbols (×, ⁻, …).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["latex: needs a LaTeX distribution (latex, dvipng) or pdfcrop on the PATH"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
