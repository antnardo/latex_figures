[project]
name = "latex_figures"
dynamic = ["version"]
description = "Figures matplotlib prêtes pour LaTeX : taille en cm, polices, virgule décimale, rognage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antonin Marchand" }]
keywords = ["matplotlib", "latex", "figures", "siunitx", "enseignement"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Natural Language :: French",
    "Typing :: Typed",
]
dependencies = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/antnardo/latex_figures"
Repository = "https://github.com/antnardo/latex_figures"
Issues = "https://github.com/antnardo/latex_figures/issues"
Changelog = "https://github.com/antnardo/latex_figures/blob/main/CHANGELOG.md"

[dependency-groups]
# scipy ne sert qu'à l'exemple (fonction de Bessel).
dev = ["pytest", "ruff", "mypy", "scipy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# La version vit dans le module : une seule source, que la publication compare à
# l'étiquette de la release.
[tool.hatch.version]
path = "src/latex_figures/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/latex_figures"]

# Le sdist : le code, les exemples et la documentation ; ni les tests ni uv.lock.
[tool.hatch.build.targets.sdist]
include = ["/src", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH", "RET"]
# RUF001-003 : la prose utilise des tirets typographiques et des accents.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
